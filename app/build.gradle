plugins {
    id 'com.android.application'
}

android {
    namespace 'com.flipperx.launcher'
    compileSdk 34

    defaultConfig {
        applicationId "com.flipperx.launcher"
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    // Release signing key is NOT in the repo. CI decodes it from the FX_KEYSTORE_B64
    // secret; locally, point FX_KEYSTORE at your .jks. Without it, builds fall back to
    // the standard Android debug key. v1 + v2 both on: some locked carrier installers want v1.
    def fxKeystore = System.getenv('FX_KEYSTORE')
    signingConfigs {
        fx {
            if (fxKeystore) {
                storeFile file(fxKeystore)
                storePassword System.getenv('FX_KEYSTORE_PASSWORD')
                keyAlias System.getenv('FX_KEY_ALIAS') ?: 'fxkey'
                keyPassword System.getenv('FX_KEY_PASSWORD') ?: System.getenv('FX_KEYSTORE_PASSWORD')
            }
            enableV1Signing true
            enableV2Signing true
        }
    }

    buildTypes {
        debug {
            if (fxKeystore) signingConfig signingConfigs.fx
        }
        release {
            minifyEnabled false
            if (fxKeystore) signingConfig signingConfigs.fx
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Battle-tested USB-serial drivers (CH340, CP210x, FTDI, CDC-ACM, PL2303) — pure Java,
    // works on 32-bit armeabi-v7a. Lets FLIPPER X actually talk to attached modules.
    implementation 'com.github.mik3y:usb-serial-for-android:3.8.1'
}
