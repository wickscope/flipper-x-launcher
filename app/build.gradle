plugins {
    id 'com.android.application'
}

android {
    namespace 'com.flipperx.launcher'
    compileSdk 34

    defaultConfig {
        applicationId "com.flipperx.launcher"
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        debug {
            // Fixed key committed to the repo so every CI build signs identically —
            // lets updates install in place instead of forcing an uninstall.
            // Both schemes on: some locked carrier installers want v1 (JAR) too.
            storeFile file('fx.keystore')
            storePassword 'flipperx'
            keyAlias 'fxkey'
            keyPassword 'flipperx'
            enableV1Signing true
            enableV2Signing true
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // same fixed key
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Battle-tested USB-serial drivers (CH340, CP210x, FTDI, CDC-ACM, PL2303) — pure Java,
    // works on 32-bit armeabi-v7a. Lets FLIPPER X actually talk to attached modules.
    implementation 'com.github.mik3y:usb-serial-for-android:3.8.1'
}
