plugins {
    id 'com.android.application'
}

android {
    namespace 'com.flipperx.launcher'
    compileSdk 34

    defaultConfig {
        applicationId "com.flipperx.launcher"
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        debug {
            // Force BOTH signature schemes on: some locked carrier installers
            // reject v2-only APKs and want the older v1 (JAR) signature too.
            enableV1Signing true
            enableV2Signing true
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // self-signed so it installs without a keystore
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies { }
