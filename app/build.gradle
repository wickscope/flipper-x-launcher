plugins {
    id 'com.android.application'
}

android {
    namespace 'com.flipperx.launcher'
    compileSdk 34

    defaultConfig {
        applicationId "com.flipperx.launcher"
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            // debug-signed; installs via sideload, no Play needed
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // self-signed so it installs without a keystore
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies { }
