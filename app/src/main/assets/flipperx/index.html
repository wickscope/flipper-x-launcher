<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>FLIPPER X</title>
<style>
:root{
  --bg:#060d0b; --panel:#0b1613; --panel2:#0e1d18; --line:#1b3a30;
  --accent:#2bd48a; --accent2:#5dcaa5; --dim:#3f9e80; --text:#c6ead9;
  --muted:#5f9d87; --warn:#e0ad4e; --danger:#e2564a; --ok:#2bd48a;
  --radius:9px; --mono:ui-monospace,"Cascadia Mono","Consolas","DejaVu Sans Mono",monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;font-family:var(--mono);color:var(--text)}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}
#device{position:relative;width:100%;max-width:400px;height:100vh;max-height:860px;background:var(--bg);
  display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line)}
@media(min-width:420px){#device{border-radius:18px;height:92vh}}

/* status bar */
#statusbar{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;font-size:11px;
  color:var(--accent2);border-bottom:1px solid var(--line);background:#07110e;flex:0 0 auto}
#statusbar .l,#statusbar .r{display:flex;gap:9px;align-items:center}
#statusbar .r i{opacity:.85}
.radio-off{color:var(--dim)}
#clock{color:#e6fff6;font-weight:600}

/* content */
#content{flex:1 1 auto;overflow-y:auto;padding:12px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
#content::-webkit-scrollbar{width:4px}
#content::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px}
.vhead{display:flex;align-items:center;gap:8px;margin:0 0 10px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.vhead .tag{font-size:10px;letter-spacing:2px;color:var(--dim)}
.vhead h1{font-size:15px;margin:0;color:#e6fff6;font-weight:600;letter-spacing:1px}
.vhead .ico{font-size:18px;color:var(--accent)}

/* softkeys */
#softkeys{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;font-size:11px;
  color:var(--muted);border-top:1px solid var(--line);background:#07110e;flex:0 0 auto}
#softkeys b{color:var(--accent2);font-weight:600}
#softkeys .mid{color:var(--dim);letter-spacing:1px}

/* home grid */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{position:relative;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);
  padding:12px 6px;text-align:center;min-height:74px;display:flex;flex-direction:column;justify-content:center;
  gap:5px;cursor:pointer;transition:border-color .12s,background .12s}
.tile .num{position:absolute;top:5px;left:8px;font-size:10px;color:var(--dim)}
.tile .gi{font-size:22px;line-height:1}
.tile .nm{font-size:11px;color:var(--accent2)}
.tile.sel{border-color:var(--accent);background:var(--panel2);box-shadow:0 0 0 1px var(--accent) inset}
.tile.sel .nm{color:#e6fff6}

/* generic list rows */
.row{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--panel);margin-bottom:7px;cursor:pointer}
.row.sel{border-color:var(--accent);background:var(--panel2)}
.row .ri{font-size:17px;color:var(--accent);width:22px;text-align:center;flex:0 0 auto}
.row .rt{flex:1;min-width:0}
.row .rt .t1{font-size:13px;color:#e6fff6}
.row .rt .t2{font-size:10.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rv{font-size:11px;color:var(--accent2);flex:0 0 auto}
.pill{font-size:9.5px;padding:2px 7px;border-radius:20px;border:1px solid var(--line)}
.pill.on{color:var(--bg);background:var(--accent);border-color:var(--accent)}
.pill.off{color:var(--dim)}
.pill.warn{color:var(--warn);border-color:#4a3a17}

/* panels / text */
.card{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);padding:11px;margin-bottom:9px}
.card h3{margin:0 0 7px;font-size:11px;letter-spacing:1px;color:var(--dim);font-weight:600}
.kv{display:flex;justify-content:space-between;font-size:12px;padding:3px 0}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{color:var(--text)}
.big{font-size:26px;color:#e6fff6;font-weight:600}
.hint{font-size:10.5px;color:var(--muted);line-height:1.5}
.np{font-size:11px;color:var(--accent2);min-height:15px;margin-bottom:7px;padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:rgba(11,22,18,.8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np:empty{display:none}
.note{font-size:10.5px;color:var(--warn);line-height:1.5;border-left:2px solid #4a3a17;padding-left:8px;margin:7px 0}

/* terminal */
#term{font-size:12px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
#term .c-in{color:var(--accent2)} #term .c-out{color:var(--text)} #term .c-err{color:var(--danger)}
#term .c-sys{color:var(--dim)}
.prompt{display:flex;gap:6px;align-items:center;margin-top:4px}
.prompt .ps{color:var(--accent);font-size:12px}
.prompt input{flex:1;background:transparent;border:none;outline:none;color:#e6fff6;font-family:var(--mono);font-size:12px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:7px;background:var(--panel2);
  color:var(--accent2);font-family:var(--mono);font-size:12px;padding:8px 12px;cursor:pointer;margin:3px 4px 3px 0}
.btn.sel,.btn:active{border-color:var(--accent);color:#e6fff6;background:#10241d}
.btn.danger{color:var(--danger);border-color:#4a221f}
.inp{width:100%;background:#07110e;border:1px solid var(--line);border-radius:7px;color:#e6fff6;
  font-family:var(--mono);font-size:13px;padding:9px;outline:none;margin:4px 0}

/* boot + lock overlays */
.overlay{position:absolute;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
.brandbig{font-size:30px;letter-spacing:7px;color:#e6fff6;font-weight:700}
.brandsub{font-size:10px;letter-spacing:4px;color:var(--dim)}
.bootlog{font-size:11px;color:var(--dim);white-space:pre;text-align:left;min-height:120px}
.pindots{display:flex;gap:12px;margin-top:6px}
.pindots .d{width:12px;height:12px;border-radius:50%;border:1px solid var(--accent);background:transparent}
.pindots .d.f{background:var(--accent)}
.shieldmark{font-size:40px;color:var(--accent)}
.blink{animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.hidden{display:none!important}
.scan{height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);margin:2px 0 10px;opacity:.5;
  background-size:180px 2px;animation:scanmove 2.4s linear infinite}

/* ---- quantum / futuristic ambient motion ---- */
#qfx{position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.9}
#statusbar{position:relative;z-index:3;background:rgba(7,17,14,.72)}
#content{position:relative;z-index:2}
#softkeys{position:relative;z-index:3;background:rgba(7,17,14,.72)}
.card,.tile,.row{background:rgba(11,22,18,.80);backdrop-filter:none}
.tile.sel{background:rgba(16,37,29,.92)} .row.sel{background:rgba(16,37,29,.9)}
.overlay{background:rgba(6,13,11,.66)}
.overlay#boot,.overlay#lock{background:rgba(6,13,11,.55)}
.overlay#idle{background:rgba(6,13,11,.48)}
/* ---- cobra mascot ---- */
.cobra-slot{display:flex;justify-content:center;margin-bottom:4px}
.cobra-svg{width:92px;height:96px;overflow:visible;transform-origin:50% 90%;animation:sway 4.2s ease-in-out infinite;filter:drop-shadow(0 0 6px rgba(43,212,138,.35))}
@keyframes sway{0%,100%{transform:rotate(-3.5deg)}50%{transform:rotate(3.5deg)}}
.cobra-tongue{animation:flick 2.8s ease-in-out infinite}
@keyframes flick{0%,66%,100%{opacity:0}74%,86%{opacity:1}}
.cobra-eye{animation:eyeglow 2.2s ease-in-out infinite}
@keyframes eyeglow{0%,100%{opacity:.7}50%{opacity:1}}
.cobra-hood{animation:hoodbreath 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 72%}
@keyframes hoodbreath{0%,100%{transform:scaleX(1)}50%{transform:scaleX(1.06)}}
@keyframes scanmove{0%{background-position:-180px 0}100%{background-position:220px 0}}
@keyframes glow{0%,100%{text-shadow:0 0 6px rgba(43,212,138,.35)}50%{text-shadow:0 0 15px rgba(43,212,138,.85)}}
@keyframes flicker{0%,100%{opacity:1}48%{opacity:.82}50%{opacity:.6}52%{opacity:.86}}
@keyframes rise{0%{transform:translateY(0)}100%{transform:translateY(-3px)}}
@keyframes underline{0%{background-position:-120px 0}100%{background-position:180px 0}}
.brandbig{animation:glow 3s ease-in-out infinite}
.vhead h1{animation:glow 4.5s ease-in-out infinite}
.vhead{position:relative}
.vhead::after{content:"";position:absolute;left:0;bottom:-1px;height:1px;width:100%;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);background-size:120px 1px;
  animation:underline 3s linear infinite;opacity:.7}
#shieldstat{animation:glow 2.6s ease-in-out infinite}
.gi{animation:rise 2.8s ease-in-out infinite alternate}
.shieldmark{animation:glow 2.4s ease-in-out infinite,flicker 6s linear infinite}
.big{animation:glow 3.4s ease-in-out infinite}

/* ===== Summit Flip small-screen fit (240x320 physical / ~272x363 css) ===== */
@media (max-width:360px){
  #device{max-width:none;border:none}
  #statusbar{padding:4px 7px;font-size:8.5px}
  #statusbar .l,#statusbar .r{gap:5px}
  #clock{font-size:9px}
  #content{padding:8px}
  .vhead{margin:0 0 7px;padding-bottom:5px}
  .vhead h1{font-size:13px;letter-spacing:.5px}
  .vhead .ico{font-size:15px}
  .vhead .tag{font-size:8.5px;letter-spacing:1px}
  .grid{gap:6px}
  .tile{min-height:52px;padding:7px 3px;gap:3px}
  .tile .gi{font-size:17px}
  .tile .nm{font-size:9.5px}
  .tile .num{font-size:8px;top:3px;left:5px}
  .row{padding:7px;gap:7px;margin-bottom:5px}
  .row .ri{font-size:14px;width:18px}
  .row .rt .t1{font-size:11.5px}
  .row .rt .t2{font-size:9px}
  .row .rv{font-size:10px}
  .card{padding:8px;margin-bottom:7px}
  .card h3{font-size:9.5px}
  .kv{font-size:10.5px}
  .big{font-size:19px}
  .hint,.note{font-size:9px;line-height:1.4}
  #term,.prompt .ps,.prompt input{font-size:10.5px}
  .btn{font-size:10.5px;padding:6px 9px}
  #softkeys{padding:6px 8px;font-size:9.5px}
  .cobra-svg{width:50px;height:52px}
  .overlay{padding:12px;gap:9px}
  .brandbig{font-size:21px;letter-spacing:3px}
  .brandsub{font-size:8px;letter-spacing:2px}
  .bootlog{font-size:8.5px;min-height:70px}
  .shieldmark{font-size:30px}
  #idle{padding:8px}
  #idle-sec{top:7px!important;font-size:8.5px!important;letter-spacing:1px!important}
  #cobra-quip{margin:0 0 3px!important;font-size:9px!important;min-height:11px!important}
  #idle-clock{font-size:40px!important;letter-spacing:1px!important}
  #idle-date{font-size:10px!important;letter-spacing:2px!important;margin-top:2px!important}
  #idle-radios{margin-top:12px!important;gap:10px!important;font-size:9px!important}
  #idle-np{margin-top:10px!important;font-size:9px!important;min-height:11px!important}
  #idle > div:last-child{bottom:8px!important;font-size:8.5px!important;letter-spacing:1px!important}
}
</style>
</head>
<body>
<div id="device">
  <canvas id="qfx"></canvas>
  <div id="statusbar">
    <div class="l"><span id="shieldstat" style="color:var(--accent)">●&nbsp;SECURE</span></div>
    <div class="r">
      <i class="radio-off" id="r-cell" title="cellular">CELL</i>
      <i class="radio-off" id="r-wifi" title="wifi">WiFi</i>
      <i class="radio-off" id="r-bt" title="bluetooth">BT</i>
      <i class="radio-off" id="r-gps" title="gps">GPS</i>
      <span id="clock">--:--</span>
    </div>
  </div>
  <div id="content"></div>
  <div id="softkeys">
    <b id="sk-left">MENU</b><span class="mid" id="sk-mid">FLIPPER&nbsp;X</span><b id="sk-right">LOCK</b>
  </div>

  <!-- BOOT -->
  <div class="overlay" id="boot">
    <div id="cobra-boot" class="cobra-slot"></div>
    <div class="brandbig">FLIPPER&nbsp;X</div>
    <div class="brandsub">RESEARCH&nbsp;·&nbsp;PRIVACY&nbsp;·&nbsp;OFFLINE</div>
    <div class="scan"></div>
    <div class="bootlog" id="bootlog"></div>
  </div>

  <!-- LOCK -->
  <div class="overlay hidden" id="lock">
    <div class="shieldmark">⬡</div>
    <div class="brandbig" style="font-size:22px;letter-spacing:4px">FLIPPER&nbsp;X</div>
    <div class="hint">enter access code</div>
    <div class="pindots" id="pindots"></div>
    <div class="hint" id="lockmsg" style="color:var(--muted)">keypad 0–9 · # clear · default 0000</div>
  </div>

  <!-- IDLE / COVER screen (outer display when the lid is closed) -->
  <div class="overlay hidden" id="idle">
    <div id="idle-sec" style="position:absolute;top:16px;left:0;right:0;text-align:center;font-size:11px;color:var(--accent);letter-spacing:2px">⬡ SECURE · 0 TRACKERS</div>
    <div id="cobra-idle" class="cobra-slot"></div>
    <div id="cobra-quip" class="hint" style="margin:0 0 8px;color:var(--accent2);min-height:14px;letter-spacing:1px"></div>
    <div id="idle-clock" style="font-size:54px;font-weight:700;color:#e6fff6;letter-spacing:2px;line-height:1">--:--</div>
    <div id="idle-date" style="font-size:12px;color:var(--accent2);letter-spacing:4px;margin-top:4px">—</div>
    <div id="idle-radios" style="display:flex;gap:14px;margin-top:20px;font-size:11px">
      <span class="radio-off">CELL</span><span class="radio-off">WiFi</span><span class="radio-off">BT</span><span class="radio-off">GPS</span>
    </div>
    <div id="idle-np" class="hint" style="margin-top:16px;min-height:16px;color:var(--accent2)"></div>
    <div style="position:absolute;bottom:16px;left:0;right:0;text-align:center;font-size:10px;color:var(--dim);letter-spacing:2px">⬡ FLIPPER X · open lid / press any key</div>
  </div>
</div>

<script>
"use strict";
(function(){
/* ---------- storage ---------- */
var LS={
  get:function(k,d){try{var v=localStorage.getItem("FX_"+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
  set:function(k,v){try{localStorage.setItem("FX_"+k,JSON.stringify(v));}catch(e){}},
  del:function(k){try{localStorage.removeItem("FX_"+k);}catch(e){}}
};

/* ---------- global state ---------- */
var S={
  view:"home", sel:0, playing:null, locked:true, pinBuf:"",
  pin: LS.get("pin","0000"),
  radios: LS.get("radios",{cell:false,wifi:false,bt:false,gps:false}),
  sensors: LS.get("sensors",{mic:false,cam:false,motion:false,loc:false}),
  shield: LS.get("shield",true),
  records: LS.get("records",[]),      // offline DB
  vault: LS.get("vault",[]),          // encrypted notes
  messages: LS.get("messages",[]),    // offline comms
  contacts: LS.get("contacts",[{n:"Base",id:"self"}]),
  playlist: LS.get("playlist",[]),    // music (filled from SD card)
  plugins: LS.get("plugins",[
    {id:"wardrive",name:"Wi-Fi Survey",on:true,core:true},
    {id:"btsniff",name:"BLE Logger",on:true,core:true},
    {id:"ir",name:"IR Remote (OTG)",on:false,core:false},
    {id:"nfc",name:"NFC Reader (OTG)",on:false,core:false},
    {id:"sdr",name:"SDR Scanner (OTG)",on:false,core:false}
  ]),
  termlog:[], termHist:[], termHi:0
};
function persist(){LS.set("pin",S.pin);LS.set("radios",S.radios);LS.set("sensors",S.sensors);
  LS.set("shield",S.shield);LS.set("records",S.records);LS.set("vault",S.vault);LS.set("messages",S.messages);
  LS.set("contacts",S.contacts);LS.set("playlist",S.playlist);LS.set("plugins",S.plugins);}

/* ---------- els ---------- */
var elC=document.getElementById("content"),
    elBoot=document.getElementById("boot"), elLock=document.getElementById("lock"), elIdle=document.getElementById("idle"),
    elSkL=document.getElementById("sk-left"), elSkM=document.getElementById("sk-mid"), elSkR=document.getElementById("sk-right");

/* persistent audio element — lives outside #content so re-renders never kill playback */
var FXAUD=document.createElement("audio"); FXAUD.id="fxaud"; FXAUD.preload="auto";
document.getElementById("device").appendChild(FXAUD);
FXAUD.addEventListener("ended",function(){ if(V.music&&V.music._next)V.music._next(); });
FXAUD.addEventListener("error",function(){ if(V.music&&V.music._onerr)V.music._onerr(); });
FXAUD.addEventListener("playing",function(){ if(V.music&&V.music._np)V.music._np(); });
FXAUD.addEventListener("pause",function(){ if(V.music&&V.music._np)V.music._np(); });

/* tell the ambient animation when to run (idle/lock/boot/home only — paused inside modules) */
window.__fxAnim=function(){ try{
  return (!elBoot.classList.contains("hidden"))||(!elLock.classList.contains("hidden"))||
         (!elIdle.classList.contains("hidden"))||S.view==="home";
}catch(e){ return true; } };

/* ---------- cobra mascot (digital brand character) ---------- */
var COBRA='<svg viewBox="0 0 120 120" class="cobra-svg" xmlns="http://www.w3.org/2000/svg" aria-label="FLIPPER X shark">'+
  '<path d="M60,4 L45,30 L75,30 Z" fill="#136b54" stroke="#5dcaa5" stroke-width="1.5" stroke-linejoin="round"/>'+
  '<path d="M26,64 L3,80 L33,84 Z" fill="#136b54" stroke="#5dcaa5" stroke-width="1.5" stroke-linejoin="round"/>'+
  '<path d="M94,64 L117,80 L87,84 Z" fill="#136b54" stroke="#5dcaa5" stroke-width="1.5" stroke-linejoin="round"/>'+
  '<path d="M60,18 C33,18 21,39 25,62 C28,85 45,99 60,99 C75,99 92,85 95,62 C99,39 87,18 60,18 Z" fill="#1d9e75" stroke="#5dcaa5" stroke-width="2"/>'+
  '<path d="M33,74 C42,91 54,98 60,98 C66,98 78,91 87,74 C74,81 46,81 33,74 Z" fill="#2bd48a" opacity="0.55"/>'+
  '<path d="M33,50 q-3,7 0,14 M40,48 q-3,8 0,16" fill="none" stroke="#0a5141" stroke-width="1.6" opacity="0.6"/>'+
  '<path d="M87,50 q3,7 0,14 M80,48 q3,8 0,16" fill="none" stroke="#0a5141" stroke-width="1.6" opacity="0.6"/>'+
  '<circle cx="46" cy="50" r="7.5" fill="#06110d"/><circle cx="74" cy="50" r="7.5" fill="#06110d"/>'+
  '<circle class="cobra-eye" cx="46" cy="50" r="3.6" fill="#ffd36b"/><circle class="cobra-eye" cx="74" cy="50" r="3.6" fill="#ffd36b"/>'+
  '<circle cx="47.6" cy="48.2" r="1.2" fill="#ffffff"/><circle cx="75.6" cy="48.2" r="1.2" fill="#ffffff"/>'+
  '<path d="M37,70 Q60,65 83,70 Q60,93 37,70 Z" fill="#06110d" stroke="#0a5141" stroke-width="1"/>'+
  '<path d="M40,70 L45,79 L50,70 L55,79 L60,70 L65,79 L70,70 L75,79 L80,70 Z" fill="#eafff6"/>'+
  '<path d="M46,85 L50,79 L55,85 L60,79 L65,85 L70,79 L74,85 Z" fill="#cdeedd"/>'+
  '</svg>';
(function(){var a=document.getElementById("cobra-boot"),b=document.getElementById("cobra-idle");
  if(a)a.innerHTML=COBRA; if(b)b.innerHTML=COBRA;})();
var QUIPS=["all quiet","0 trackers","shields up","no one is watching","radios silent","standing guard","nothing leaks"];
setInterval(function(){var q=document.getElementById("cobra-quip");
  if(q&&elIdle&&!elIdle.classList.contains("hidden")) q.textContent='"'+QUIPS[Math.floor(Math.random()*QUIPS.length)]+'"';},3600);

/* ---------- clock + radios ---------- */
function two(n){return(n<10?"0":"")+n;}
function tick(){var d=new Date();document.getElementById("clock").textContent=two(d.getHours())+":"+two(d.getMinutes());
  if(elIdle&&!elIdle.classList.contains("hidden"))updateIdle();}
setInterval(tick,1000);tick();
function paintRadios(){
  [["cell","r-cell"],["wifi","r-wifi"],["bt","r-bt"],["gps","r-gps"]].forEach(function(p){
    var e=document.getElementById(p[1]); if(!e)return;
    e.className=S.radios[p[0]]?"":"radio-off"; });
  var any=S.radios.cell||S.radios.wifi||S.radios.bt||S.radios.gps||S.sensors.mic||S.sensors.cam||S.sensors.loc;
  var ss=document.getElementById("shieldstat");
  ss.textContent=S.shield&&!S.sensors.loc?"● SECURE":"● OPEN";
  ss.style.color=S.shield&&!S.sensors.loc?"var(--accent)":"var(--warn)";
}

/* ---------- home modules ---------- */
var MODS=[
  {id:"shield", nm:"Shield",   ic:"⬡"},
  {id:"terminal",nm:"Terminal", ic:"▮"},
  {id:"python", nm:"Python",   ic:"λ"},
  {id:"network", nm:"Network",  ic:"≋"},
  {id:"comms",  nm:"Comms",    ic:"✉"},

/* ---------- terminal ---------- */
var TERM={
  banner:function(){return "FLIPPER X shell v1.0  (type 'help')";},
  run:function(line){
    var a=line.trim().split(/\s+/),cmd=a[0].toLowerCase(),arg=a.slice(1).join(" ");
    var out=[];
    function p(s,c){out.push({t:s,c:c||"out"});}
    switch(cmd){
      case"": break;
      case"help": p("commands:","sys");
        p("help  sysinfo  shield  net  scan  radios  gps  vault  db  plugins  clear");
        p("echo  date  whoami  ver  uptime  music  wipe  about"); break;
      case"sysinfo": p("FLIPPER X · Research OS");p("host    : Summit Flip SL006D");
        p("soc     : MediaTek MT6739 (quad, armv7)");p("os base : Android 12 · 32-bit");
        p("ram     : ~1 GB   storage: 1 TB card"); break;
      case"ver": p("FLIPPER X 1.0 / build "+BUILD); break;
      case"whoami": p("operator@flipperx"); break;
      case"date": p(new Date().toString()); break;
      case"uptime": p(Math.floor((Date.now()-BOOTED)/1000)+"s since boot"); break;
      case"echo": p(arg); break;
      case"shield": p("tracking shield: "+(S.shield?"ACTIVE":"off"));p("outbound connections: 0");
        p("gps:"+(S.radios.gps?"on":"off")+"  mic:"+(S.sensors.mic?"on":"off")+"  cam:"+(S.sensors.cam?"on":"off")); break;
      case"radios": p("cell:"+(S.radios.cell?"on":"off")+"  wifi:"+(S.radios.wifi?"on":"off")+"  bt:"+(S.radios.bt?"on":"off")+"  gps:"+(S.radios.gps?"on":"off")); break;
      case"net": p("interfaces:");p(" wlan0  "+(S.radios.wifi?"UP (bridge)":"DOWN"));p(" bt0    "+(S.radios.bt?"UP (bridge)":"DOWN"));
        p("online: "+(navigator.onLine?"yes":"no"),"sys"); break;
      case"scan": if(!S.radios.wifi&&!S.radios.bt){p("enable wifi or bt in shield first","err");break;}
        p("scanning... (hardware bridge required for live radio)","sys");
        p(" AP  34:2c:** -58dBm  ch6   WPA2");p(" AP  a0:91:** -71dBm  ch11  WPA2");p(" BLE 7c:64:** -66dBm  tag"); break;
      case"gps": p(S.radios.gps?"GPS enabled — acquiring (bridge required)":"GPS is OFF (shield). nothing is tracking you.","sys"); break;
      case"vault": p("vault: "+S.vault.length+" encrypted item(s). open Shield→vault to view."); break;
      case"db": p("offline database: "+S.records.length+" record(s). open Database module."); break;
      case"plugins": S.plugins.forEach(function(pl){p(" ["+(pl.on?"x":" ")+"] "+pl.id+"  "+pl.name);}); break;
      case"music": p("playlist: "+S.playlist.length+" track(s) on card."); break;
      case"clear": S.termlog=[]; return [];
      case"about": p("FLIPPER X — offline research & privacy OS","sys");p("built for the Summit Flip. no google, no tracking."); break;
      case"wipe": p("use Settings→Wipe (requires access code)","err"); break;
      default: p("unknown: "+cmd+"  (try 'help')","err");
    }
    return out;
  }
};

  render:function(){

      '<div id="term">'+body+'</div>'+
      '<div class="prompt"><span class="ps">flipperx$</span><input id="termin" autocomplete="off" '+
      'autocapitalize="off" spellcheck="false" placeholder="type a command, Enter"></div>';
  },
  mounted:function(){var i=document.getElementById("termin");if(i){i.focus();
    i.addEventListener("keydown",function(e){
      if(e.key==="Enter"){var v=i.value;S.termlog.push({t:"flipperx$ "+v,c:"in"});
        if(v.trim()){S.termHist.push(v);S.termHi=S.termHist.length;}
        var o=TERM.run(v); S.termlog=S.termlog.concat(o); i.value=""; draw(); e.preventDefault();}
      else if(e.key==="ArrowUp"){if(S.termHi>0){S.termHi--;i.value=S.termHist[S.termHi]||"";}e.preventDefault();}
      else if(e.key==="ArrowDown"){if(S.termHi<S.termHist.length){S.termHi++;i.value=S.termHist[S.termHi]||"";}e.preventDefault();}
      else if(e.key==="Escape"){home();}
      e.stopPropagation();
    });
    var t=document.getElementById("term"); if(t){var c=document.getElementById("content");c.scrollTop=c.scrollHeight;}
  }},
  noKeyRoute:true
};

  },
  _loaded:null, _pt:null,
  mounted:function(){ this._np(); this._scroll(); this._schedPre(); },
  _scroll:function(){ var el=elC.querySelector('.row[data-i="'+S.sel+'"]'); if(el&&el.scrollIntoView)el.scrollIntoView({block:"nearest"}); },
  _sel:function(ni){ if(!S.playlist.length)return;
    ni=Math.max(0,Math.min(S.playlist.length-1,ni));
    var cur=elC.querySelector('.row.sel'); if(cur)cur.classList.remove("sel");
    S.sel=ni; var el=elC.querySelector('.row[data-i="'+ni+'"]');
    if(el){ el.classList.add("sel"); if(el.scrollIntoView)el.scrollIntoView({block:"nearest"}); }
    this._schedPre(); },
  _schedPre:function(){ var self=this; if(self._pt)clearTimeout(self._pt);
    self._pt=setTimeout(function(){ self._pre(); },350); },
  _pre:function(){ // preload the highlighted track while idle so play() starts instantly
    if(!S.playlist.length||!FXAUD.paused||this._loaded===S.sel)return;
    var tr=S.playlist[S.sel]; if(!tr||!tr.src)return;
    try{ FXAUD.src=tr.src; FXAUD.load(); this._loaded=S.sel; }catch(e){} },
  onKey:function(k){
    if(!S.playlist.length)return;
    if(k==="ArrowDown"){this._sel(S.sel+1);}
    else if(k==="ArrowUp"){this._sel(S.sel-1);}
    else if(k==="ArrowRight"){this._sel(S.sel+8);}
    else if(k==="ArrowLeft"){this._sel(S.sel-8);}
    else if(k==="Enter"){ if(S.playing===S.sel && !FXAUD.paused){ FXAUD.pause(); } else { this.play(S.sel); } }
  },
  click:function(t){var r=t.closest("[data-i]");if(r)this.play(+r.dataset.i);},
  play:function(i){ var tr=S.playlist[i]; if(!tr||!tr.src)return;
    var prev=S.playing; S.playing=i;
    try{
      if(this._loaded!==i){ FXAUD.src=tr.src; this._loaded=i; }   // already preloaded? -> instant
      var p=FXAUD.play(); if(p&&p.catch)p.catch(function(){V.music._onerr();});
    }catch(e){ this._onerr(); }
    if(S.view==="music"){ this._mark(prev,i); this._np(); } },
  _mark:function(prev,cur){ // update the ▶ icon in-place without a full re-render
    var a=(prev!=null)?elC.querySelector('.row[data-i="'+prev+'"] .ri'):null; if(a)a.textContent="♪";
    var b=elC.querySelector('.row[data-i="'+cur+'"] .ri'); if(b)b.textContent="▶"; },
  _next:function(){ if(S.playing==null)return; var n=S.playing+1;
    if(n<S.playlist.length){ if(S.view==="music")this.play(n); else { var t=S.playlist[n]; S.playing=n; try{FXAUD.src=t.src;FXAUD.play();}catch(e){} } } },
  _onerr:function(){ var n=document.getElementById("np"); if(n)n.textContent="⚠ skipping unreadable track"; this._next(); },
  _np:function(){ var n=document.getElementById("np"); if(!n)return;
    var tr=(S.playing!=null)?S.playlist[S.playing]:null;
    n.textContent=tr?((FXAUD.paused?"⏸ ":"♪ ")+tr.title):""; }
};

/* ---------- helpers ---------- */
function head(t,ic,tag){return '<div class="vhead"><span class="ico">'+ic+'</span><div>'+
  '<div class="tag">'+tag+'</div><h1>'+t+'</h1></div></div>';}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
var BUILD="2026.11.15", BOOTED=Date.now();
S.pylog=[{t:"FLIPPER X python console — fx.* API ready",c:"sys"}];

function pyEval(src){
  src=src.trim(); if(!src)return{t:"",c:"out"};
  try{
    var m=src.match(/^print\((.*)\)$/s);
    var expr=m?m[1]:src;
    // very small safe arithmetic/string evaluator
    if(/^[\s\d+\-*/%().,**'"a-zA-Z_]+$/.test(expr)){
      var val=Function('"use strict";var fx={radios:'+JSON.stringify(S.radios)+',shield:'+S.shield+'};return ('+
        expr.replace(/\*\*/g,"**")+');')();
      return{t:String(val),c:"out"};
    }
    return{t:"ok",c:"out"};
  }catch(e){return{t:"Error: "+e.message,c:"err"};}
}

/* ---------- router / render ---------- */
V.plugins.keys={};
function open(id){S.view=id;S.sel=0;draw();var v=V[id];if(v&&v.mounted)v.mounted();}
function home(){open("home");}
function curV(){return V[S.view]||V.home;}
function draw(){
  var v=curV();
  elC.innerHTML=v.render();
  // softkeys
  elSkL.textContent=(S.view==="home")?"SETTINGS":"BACK";
  elSkM.textContent=(S.view==="home")?"FLIPPER X":S.view.toUpperCase();
  elSkR.textContent="LOCK";
  paintRadios();
  if(v.mounted&&S.view!=="home")v.mounted();
  // click binding
  elC.onclick=function(e){var v2=curV();
    if(v2.click)v2.click(e.target);
  };
}

/* ---------- global keys ---------- */
document.addEventListener("keydown",function(e){
  if(!elBoot.classList.contains("hidden"))return;
  if(!elIdle.classList.contains("hidden")){ elIdle.classList.add("hidden"); doLock(); e.preventDefault(); return; }
  if(!elLock.classList.contains("hidden")){ lockKey(e); return; }
  var k=e.key;
  // # closes the lid -> outer idle / cover screen
  if(k==="#"){ showIdle(); e.preventDefault(); return; }
  var v=curV();
  if(v.noKeyRoute){ // terminal/python manage their own input; Esc handled there
    return;
  }
  // feature-phone numeric navigation inside modules (digits are module shortcuts only on home)
  if(S.view!=="home"){
    if(k==="2")k="ArrowUp"; else if(k==="8")k="ArrowDown";
    else if(k==="4")k="ArrowLeft"; else if(k==="6")k="ArrowRight"; else if(k==="5")k="Enter";
  }
  if(k==="Backspace"||k==="Escape"){ if(S.view==="home"){ showIdle(); } else { home(); } e.preventDefault(); return; }
  if(k==="*" && S.view!=="home"){ open("shield"); e.preventDefault(); return; }
  if((v.keys&&v.keys.left)&&(k==="F1")){ open(v.keys.left); return; }
  if(v.onKey){ v.onKey(k); }
  else if(k>="1"&&k<="9"&&S.view==="home"){ V.home.onKey(k); }
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Enter"].indexOf(k)>=0)e.preventDefault();
});

/* show the shark cover screen whenever the screen wakes / lid reopens */
document.addEventListener("visibilitychange",function(){
  if(!document.hidden && elBoot.classList.contains("hidden") && elIdle.classList.contains("hidden")){ showIdle(); }
});

/* softkey clicks */
elSkL.onclick=function(){ if(S.view==="home")open("settings"); else home(); };
elSkR.onclick=function(){ showIdle(); };
elSkM.onclick=function(){ home(); };

/* ---------- lock ---------- */
var pinEl=document.getElementById("pindots"), lockMsg=document.getElementById("lockmsg");
function paintPin(){var h="";for(var i=0;i<4;i++){h+='<div class="d'+(i<S.pinBuf.length?' f':'')+'"></div>';}pinEl.innerHTML=h;}
function lockKey(e){
  var k=e.key;
  if(k>="0"&&k<="9"){ S.pinBuf+=k; paintPin();
    if(S.pinBuf.length>=S.pin.length){ setTimeout(checkPin,120); } e.preventDefault(); return; }
  if(k==="#"||k==="Backspace"||k==="Escape"){ S.pinBuf=""; paintPin(); e.preventDefault(); }
}
function checkPin(){
  if(S.pinBuf===S.pin){ S.locked=false; elLock.classList.add("hidden"); S.pinBuf=""; chrome(true); home(); }
  else { lockMsg.textContent="wrong code"; lockMsg.style.color="var(--danger)"; S.pinBuf=""; paintPin();
    setTimeout(function(){lockMsg.textContent="keypad 0–9 · # clear";lockMsg.style.color="var(--muted)";},1200); }
}
function chrome(on){var s=document.getElementById("statusbar"),k=document.getElementById("softkeys");if(s)s.style.display=on?"":"none";if(k)k.style.display=on?"":"none";}
chrome(false);
function doLock(){ S.locked=true; S.pinBuf=""; paintPin(); elIdle.classList.add("hidden"); elLock.classList.remove("hidden"); chrome(false); }
function updateIdle(){ var d=new Date();
  var days=["SUN","MON","TUE","WED","THU","FRI","SAT"],mon=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
  document.getElementById("idle-clock").textContent=two(d.getHours())+":"+two(d.getMinutes());
  document.getElementById("idle-date").textContent=days[d.getDay()]+" · "+mon[d.getMonth()]+" "+d.getDate();
  document.getElementById("idle-sec").textContent=(S.shield&&!S.sensors.loc)?"⬡ SECURE · 0 TRACKERS":"⬡ SHIELD OFF";
  var rids=document.querySelectorAll("#idle-radios span"),rk=[S.radios.cell,S.radios.wifi,S.radios.bt,S.radios.gps];
  for(var i=0;i<rids.length;i++){ rids[i].className=rk[i]?"":"radio-off"; }
  var np=document.getElementById("idle-np"),tr=(S.playing!=null)?S.playlist[S.playing]:null;
  np.textContent=(tr&&!FXAUD.paused)?("♪ "+(tr.title||"")):"";
}
function showIdle(){ S.locked=true; S.pinBuf=""; updateIdle(); elLock.classList.add("hidden"); elIdle.classList.remove("hidden"); chrome(false); }
elLock.addEventListener("click",function(){document.getElementById("device").focus();});

/* ---------- 4D ambient field: perspective starfield + rotating tesseract ---------- */
(function(){
  var cv=document.getElementById("qfx"), ctx=cv.getContext("2d"), dev=document.getElementById("device");
  var W=0,H=0,CX=0,CY=0,DPR=1;
  function size(){ var r=dev.getBoundingClientRect(); W=r.width;H=r.height;CX=W/2;CY=H/2;
    cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+"px";cv.style.height=H+"px";ctx.setTransform(DPR,0,0,DPR,0,0); }

  // 3D starfield flying toward the camera (lightweight for the MT6739)
  var STARS=[], NS=14;
  function reseed(s){ s.x=(Math.random()*2-1)*CX*0.9; s.y=(Math.random()*2-1)*CY*0.9;
    s.z=Math.random()*1.3+0.25; s.ph=Math.random()*6.28; }
  function seed(){ STARS=[]; for(var i=0;i<NS;i++){ var s={}; reseed(s); STARS.push(s); } }
  window.addEventListener("resize",function(){size();seed();}); size(); seed();

  // tesseract: 16 vertices in 4D, 32 edges
  var V4=[], EDG=[], i,b;
  for(i=0;i<16;i++){ V4.push([ (i&1?1:-1),(i&2?1:-1),(i&4?1:-1),(i&8?1:-1) ]); }
  for(i=0;i<16;i++){ for(b=0;b<4;b++){ var j=i^(1<<b); if(j>i) EDG.push([i,j]); } }
  function rot(p,a){ // rotate the 4D point through XW, YZ and XY planes
    var x=p[0],y=p[1],z=p[2],w=p[3];
    var c=Math.cos(a),s=Math.sin(a);            var x1=x*c-w*s, w1=x*s+w*c;      // XW
    var c2=Math.cos(a*0.76),s2=Math.sin(a*0.76);var y1=y*c2-z*s2, z1=y*s2+z*c2;  // YZ
    var c3=Math.cos(a*0.5),s3=Math.sin(a*0.5);  var x2=x1*c3-y1*s3, y2=x1*s3+y1*c3; // XY
    return [x2,y2,z1,w1];
  }
  function project4(p,scale){
    var w=1/(2.7-p[3]); var x=p[0]*w, y=p[1]*w, z=p[2]*w;   // 4D -> 3D
    var k=1/(2.5-z);                                         // 3D -> 2D
    return [CX+x*k*scale, CY+y*k*scale, (p[3]+2)/4];
  }

  var ang=0,last=0,FRAME=60,scan=0;
  function loop(t){
    requestAnimationFrame(loop);
    if(t-last<FRAME) return;
    if(document.hidden){ last=t; return; }                 // screen off -> no work
    if(window.__fxAnim && !window.__fxAnim()){ last=t; return; } // inside a module -> paused
    last=t;
    ctx.fillStyle="rgba(6,13,11,0.30)"; ctx.fillRect(0,0,W,H); // depth trails

    // --- light starfield: cheap squares, no O(n^2) links ---
    for(i=0;i<STARS.length;i++){ var st=STARS[i]; st.z-=0.006;
      if(st.z<0.14){ reseed(st); st.z=1.55; }
      var sx=CX+st.x/st.z, sy=CY+st.y/st.z, r=Math.min(2.4,0.7/st.z), a=Math.max(0,Math.min(1,1.5-st.z));
      ctx.fillStyle="rgba(120,255,214,"+(a*0.5)+")"; ctx.fillRect(sx-r*0.5,sy-r*0.5,r,r); }

    // --- rotating tesseract (4D) — the signature motion ---
    ang+=0.006;
    var scale=Math.min(W,H)*0.16, pts=[];
    for(i=0;i<16;i++){ pts.push(project4(rot(V4[i],ang),scale)); }
    for(var e=0;e<EDG.length;e++){ var p=pts[EDG[e][0]], q=pts[EDG[e][1]], depth=(p[2]+q[2])/2;
      ctx.strokeStyle="rgba(93,202,165,"+(0.08+depth*0.26)+")"; ctx.lineWidth=0.5+depth*0.9;
      ctx.beginPath(); ctx.moveTo(p[0],p[1]); ctx.lineTo(q[0],q[1]); ctx.stroke(); }

    // --- single flat scanline ---
    scan+=1.1; if(scan>H+30) scan=-18;
    ctx.fillStyle="rgba(43,212,138,0.06)"; ctx.fillRect(0,scan-12,W,24);
  }
  requestAnimationFrame(loop);
})();
</script>
